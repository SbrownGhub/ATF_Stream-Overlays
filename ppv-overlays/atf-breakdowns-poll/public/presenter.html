<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<title>ATF — Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="/atf-live.js"></script>
<style>
:root{ --red:#E11B26; --blue:#2A5BF0; --amber:#FF9800; --bone:#F2EDE4; --steel:#7A828C;
  --line:#24262B; --panel:#131417; --green:#12C46B; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#0A0A0A;color:var(--bone);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;}
.pr{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));}
.hd{display:flex;align-items:center;gap:9px;}
.hd .a{font-family:Anton,sans-serif;font-size:22px;}
.hd .b{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:2.4px;color:var(--amber);}
.hd .sp{flex:1;}
.mono{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.6px;color:#B9BEC6;}
.conn{width:8px;height:8px;border-radius:50%;background:#3A3F47;}
.conn.on{background:var(--green);box-shadow:0 0 10px var(--green);}
.conn.off{background:var(--red);}
.row2{display:flex;justify-content:space-between;align-items:center;}
.st{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;padding:5px 9px;
  border-radius:20px;border:1px solid var(--line);color:var(--steel);}
.st.open{color:var(--green);border-color:rgba(18,196,107,.5);background:rgba(18,196,107,.1);}
.st.frozen{color:var(--amber);border-color:rgba(255,152,0,.5);background:rgba(255,152,0,.1);}

.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.ctl button{padding:13px 4px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
  background:#16181C;color:var(--bone);font-family:Inter,sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.4px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;}
.ctl .go{background:var(--green);color:#04120A;border-color:var(--green);}
.ctl .fz{background:var(--amber);color:#0A0A0A;border-color:var(--amber);}
.ctl button:disabled{opacity:.28;}
/* hold-to-reset: a bar fills while you hold; let go early and nothing happens */
.ctl .rs .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(225,27,38,.55);}
.ctl .rs.holding .fill{width:100%;transition:width .9s linear;}
.ctl .rs span{position:relative;}

.grid{display:flex;flex-direction:column;gap:5px;}
.gr{display:grid;grid-template-columns:44px 56px 1fr 56px 44px;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 6px;}
.gr .ab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
.gr .ab img{width:26px;height:26px;background:#F0EDE7;border-radius:50%;padding:3px;}
.gr .ab span{font-family:Anton,sans-serif;font-size:13px;letter-spacing:1px;}
.gr .v{text-align:center;}
.gr .v .n{font-family:Anton,sans-serif;font-size:20px;line-height:1;}
.gr .v .c{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.6px;color:var(--steel);margin-top:3px;}
.gr .v.r .n{color:#FF5A62;} .gr .v.b .n{color:#6E90FF;}
.tk{width:44px;height:44px;border-radius:50%;padding:0;cursor:pointer;border:2px dashed #3A3F47;
  background:#101216;display:flex;align-items:center;justify-content:center;}
.tk svg{width:18px;height:18px;opacity:.25;}
.tk.r.on{background:var(--red);border:0;box-shadow:0 0 12px rgba(225,27,38,.6);}
.tk.b.on{background:var(--blue);border:0;box-shadow:0 0 12px rgba(42,91,240,.6);}
.tk.on svg{opacity:1;}
.ft{display:flex;justify-content:space-between;padding:2px 2px 0;}
.ft b{color:var(--bone);font-weight:400;}
.hint{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.4px;color:#565C65;text-align:center;}

.gate{max-width:460px;margin:0 auto;padding:calc(80px + env(safe-area-inset-top)) 22px 40px;}
.gate h1{font-family:Anton,sans-serif;font-size:38px;margin:26px 0 8px;}
.gate p{color:#9AA1AA;font-size:14px;line-height:1.5;margin:0 0 20px;}
.gate input{width:100%;padding:14px;background:#0C0D10;border:1px solid var(--line);color:var(--bone);
  font-size:16px;border-radius:3px;margin-bottom:10px;}
.gate button{width:100%;padding:15px;border:0;border-radius:3px;background:var(--amber);color:#0A0A0A;
  font-family:Anton,sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;}
.err{color:#FF6B72;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;min-height:16px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CW = `<svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l6.5 6.5L25 7"/></svg>`;
const app = document.getElementById('app');
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let key = store.get('atf_presenter_key');
let S = null, live = null, conn = null;

/* ---------- key gate: the key is checked by the server on every action ---------- */
function gate(msg){
  app.innerHTML = `<div class="gate">
    <div class="hd"><span class="a">ATF</span><span class="b">PRESENTER</span></div>
    <h1>PRESENTER ACCESS</h1>
    <p>Enter the presenter key. It's stored on this device only, and checked by the server on every action.</p>
    <input id="k" type="password" autocomplete="current-password" placeholder="Presenter key">
    <div class="err">${msg || ''}</div>
    <button id="go">UNLOCK</button></div>`;
  const go = () => { const v = document.getElementById('k').value.trim(); if(!v) return;
    key = v; store.set('atf_presenter_key', v); boot(); };
  document.getElementById('go').onclick = go;
  document.getElementById('k').onkeydown = e => { if(e.key === 'Enter') go(); };
}

async function act(payload){
  try{
    const r = await fetch('/api/control', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-atf-key': key }, body: JSON.stringify(payload) });
    if(r.status === 401){ store.del('atf_presenter_key'); key = null; gate('That key was rejected.'); return; }
    if(!r.ok) throw 0;
    live.deliver(await r.json());
  }catch(e){ flashErr(); }
}
function flashErr(){
  const c = document.getElementById('conn');
  if(c){ c.className = 'conn off'; setTimeout(() => render(), 1200); }
}

function shell(){
  app.innerHTML = `<div class="pr">
    <div class="hd"><span class="a">ATF</span><span class="b">PRESENTER</span><span class="sp"></span>
      <span class="mono" id="pool">— IN POOL</span><span class="conn" id="conn"></span></div>
    <div class="row2"><span class="st" id="st">IDLE</span><span class="mono" id="lock" style="color:#565C65;cursor:pointer">LOCK</span></div>
    <div class="ctl">
      <button class="go" id="bOpen">OPEN</button>
      <button class="fz" id="bFreeze">FREEZE</button>
      <button class="rs" id="bReset"><i class="fill"></i><span>HOLD TO RESET</span></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="ft mono"><span>FAN VOTES</span><span>TOTAL <b id="tot">0</b></span></div>
    <div class="hint">TAP A TICK TO MAKE THE PANEL'S CALL</div></div>`;

  document.getElementById('bOpen').onclick   = () => act({ action:'open' });
  document.getElementById('bFreeze').onclick = () => act({ action:'freeze' });
  document.getElementById('lock').onclick    = () => { store.del('atf_presenter_key'); key = null; clearInterval(beat); gate(); };

  /* hold 0.9s to reset — a stray tap mid-show can't wipe the board */
  const rs = document.getElementById('bReset');
  let hold = null;
  const start = e => { e.preventDefault(); rs.classList.add('holding');
    hold = setTimeout(() => { rs.classList.remove('holding'); act({ action:'reset' }); }, 900); };
  const stop  = () => { rs.classList.remove('holding'); clearTimeout(hold); };
  rs.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev => rs.addEventListener(ev, stop));

  document.getElementById('grid').addEventListener('click', e => {
    const t = e.target.closest('.tk'); if(!t || !S) return;
    const i = +t.dataset.i, c = t.dataset.c;
    const next = S.panel[i] === c ? null : c;
    S.panel[i] = next; render();                   // optimistic
    act({ action:'panel', i, pick: next });
  });
}

function render(){
  if(!S || !document.getElementById('grid')) return;
  document.getElementById('pool').textContent = S.pool.toLocaleString() + ' IN POOL';
  const c = document.getElementById('conn'); c.className = 'conn ' + (conn === false ? 'off' : 'on');
  const st = document.getElementById('st');
  st.textContent = S.status === 'open' ? '● VOTING OPEN' : S.status === 'frozen' ? 'FROZEN' : 'IDLE';
  st.className = 'st ' + S.status;
  const bo = document.getElementById('bOpen');
  bo.disabled = S.status === 'open'; bo.textContent = S.status === 'frozen' ? 'REOPEN' : 'OPEN';
  document.getElementById('bFreeze').disabled = S.status !== 'open';

  let tot = 0;
  document.getElementById('grid').innerHTML = ATF.ABILITIES.map((a, i) => {
    const v = S.tally[i], sp = ATF.split(v), p = S.panel[i]; tot += v.r + v.b;
    return `<div class="gr">
      <button class="tk r ${p === 'red' ? 'on' : ''}" data-i="${i}" data-c="red">${CW}</button>
      <div class="v r"><div class="n">${sp ? sp[0] + '%' : '—'}</div><div class="c">${v.r.toLocaleString()}</div></div>
      <div class="ab"><img src="/icons/${a.k}.png" alt=""><span>${a.l}</span></div>
      <div class="v b"><div class="n">${sp ? sp[1] + '%' : '—'}</div><div class="c">${v.b.toLocaleString()}</div></div>
      <button class="tk b ${p === 'blue' ? 'on' : ''}" data-i="${i}" data-c="blue">${CW}</button></div>`;
  }).join('');
  document.getElementById('tot').textContent = tot.toLocaleString();
}

/* Heartbeat: tells voters' phones the show is live so they poll quickly.
   Counts for 2 minutes, so locking the phone between rounds is fine. */
let beat = null;
function heartbeat(){
  clearInterval(beat);
  if(!key) return;
  act({ action:'ping' });
  beat = setInterval(() => { if(key && !document.hidden) act({ action:'ping' }); }, 20000);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && key) act({ action:'ping' }); });

function boot(){
  if(!key){ gate(); return; }
  shell();
  heartbeat();
  if(!live){
    live = ATFLive(s => { S = s; render(); }, {
      realtime:true, poll:2500,
      onConnection: v => { conn = v; render(); }
    });
  }else{ live.pull(); }
  render();
}
boot();
</script>
</body>
</html>
